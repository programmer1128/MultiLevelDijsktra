<!DOCTYPE html>
<html>
<head>
    <title>My Local Map Engine</title>
    <!-- Load MapLibre Web -->
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>body, html, #map { margin: 0; height: 100%; }</style>
</head>
<body>
<div id="map"></div>
<script>
    // 1. Fetch the OpenMapTiles-compatible "Liberty" style from OpenFreeMap
    fetch("https://tiles.openfreemap.org/styles/liberty")
      .then(response => {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
      })
      .then(style => {
          
          // 2. Intercept the style and inject your LOCAL tile server
          // OpenFreeMap names their source "openfreemap", so we overwrite it:
          style.sources.openfreemap = {
              type: "vector",
              // go-pmtiles automatically unpacks the archive into this URL structure
              tiles: ["http://localhost:8080/india/{z}/{x}/{y}.mvt"], 
              minzoom: 0,
              maxzoom: 14, // Planetiler defaults to max zoom 14 for vector generation
              attribution: "© Aritra Map Engine | Data © OpenStreetMap"
          };
          
          // 3. Draw the map!
          const map = new maplibregl.Map({
              container: 'map',
              style: style,
              center: [88.3639, 22.5726], // Centers perfectly on Kolkata
              zoom: 12
          });
      })
      .catch(error => console.error("Error loading style:", error));
</script>
</body>
</html>
